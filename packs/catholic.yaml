pack:
  pack_id: "catholic"
  tradition_family: "catholic"
  display_title: "Catholic Sacred Time"
  global_invariants:
    time_format: "24h"
    single_location_per_profile: true
    local_digital_clock_required: true

theme:
  color_tokens:
    color1: "#101418"
    color2: "#f4f2ea"
    color3: "#1f2933"
    color4: "#9f7aea"
    color5: "#6b7280"
    color6: "#e76f51"

celestial_profile:
  focus: "Canonical hours"

dial_layout:
  reserved_slots:
    - "local_digital_clock"
  allowed_positions:
    - "top_medallion"
    - "bottom_medallion"
    - "top_row_1"
    - "top_row_2"
    - "top_row_3"
    - "center_row_1"
    - "center_row_2"
    - "bottom_row_1"
    - "bottom_row_2"
    - "bottom_row_3"

mention_policy:
  slots:
    - slot_id: "on_behalf_of"
      allowed: true
      cardinality: "single"
    - slot_id: "living_mentions"
      allowed: true
      cardinality: "multiple"
    - slot_id: "deceased_mentions"
      allowed: true
      cardinality: "multiple"
