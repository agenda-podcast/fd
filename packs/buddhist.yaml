pack:
  pack_id: "buddhist"
  tradition_family: "buddhist"
  display_title: "Buddhist Sacred Time"
  global_invariants:
    time_format: "24h"
    single_location_per_profile: true
    local_digital_clock_required: true

theme:
  color_tokens:
    color1: "#12100e"
    color2: "#f7f3e8"
    color3: "#2b2621"
    color4: "#d97706"
    color5: "#7c6f64"
    color6: "#ef4444"

celestial_profile:
  focus: "Lunar observance and practice"

dial_layout:
  reserved_slots:
    - "local_digital_clock"
  allowed_positions:
    - "top_medallion"
    - "bottom_medallion"
    - "top_row_1"
    - "top_row_2"
    - "top_row_3"
    - "center_row_1"
    - "center_row_2"
    - "bottom_row_1"
    - "bottom_row_2"
    - "bottom_row_3"

mention_policy:
  slots:
    - slot_id: "on_behalf_of"
      allowed: true
      cardinality: "single"
    - slot_id: "living_mentions"
      allowed: true
      cardinality: "multiple"
    - slot_id: "deceased_mentions"
      allowed: true
      cardinality: "multiple"
