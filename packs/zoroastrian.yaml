pack:
  pack_id: "zoroastrian"
  tradition_family: "zoroastrian"
  display_title: "Zoroastrian Sacred Time"
  global_invariants:
    time_format: "24h"
    single_location_per_profile: true
    local_digital_clock_required: true

theme:
  color_tokens:
    color1: "#0f120f"
    color2: "#f4f0d8"
    color3: "#223127"
    color4: "#f2c14e"
    color5: "#6c7a6b"
    color6: "#d95d39"

celestial_profile:
  focus: "Five gah cycle"

dial_layout:
  reserved_slots:
    - "local_digital_clock"
  allowed_positions:
    - "top_medallion"
    - "bottom_medallion"
    - "top_row_1"
    - "top_row_2"
    - "top_row_3"
    - "center_row_1"
    - "center_row_2"
    - "bottom_row_1"
    - "bottom_row_2"
    - "bottom_row_3"

mention_policy:
  slots:
    - slot_id: "on_behalf_of"
      allowed: true
      cardinality: "single"
    - slot_id: "living_mentions"
      allowed: true
      cardinality: "multiple"
    - slot_id: "deceased_mentions"
      allowed: true
      cardinality: "multiple"
